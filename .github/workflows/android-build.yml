name: Android build

on:
  push:
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve sdkmanager path
        id: sdk
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -maxdepth 2 -name sdkmanager | sort -r | head -n1)"
          fi
          echo "path=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK licenses
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.path }}
        run: yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Install required Android SDK packages
        env:
          SDKMANAGER: ${{ steps.sdk.outputs.path }}
        run: |
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/transportation-location-sharing.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: transportation-location-sharing
          path: artifact/transportation-location-sharing.apk
