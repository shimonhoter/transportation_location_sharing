<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ride Map</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Shared map page used by MainActivity (mode=view), MapPickerActivity
    // (mode=pick) and AlertZonesActivity (mode=zones). Kotlin drives it via
    // evaluateJavascript() calls into the functions below; this page talks
    // back to Kotlin through the injected `Android` JavascriptInterface.

    function queryParam(name, fallback) {
      var params = new URLSearchParams(window.location.search);
      return params.has(name) ? params.get(name) : fallback;
    }

    var mode = queryParam('mode', 'view');
    var initialLat = parseFloat(queryParam('lat', '32.0853'));
    var initialLon = parseFloat(queryParam('lon', '34.7818'));
    var initialZoom = parseFloat(queryParam('zoom', '13'));

    // Fully free, keyless tile sources — no signup, no API key, no usage
    // quota to manage (see docs/SPEC_EN.md 4.1):
    // - streets: OpenFreeMap's hosted vector style, a MapLibre-native
    //   drop-in with real roads/labels (https://openfreemap.org).
    // - satellite: Esri's public World Imagery raster tiles, built as a
    //   minimal inline MapLibre style object (a single raster source/layer)
    //   since OpenFreeMap doesn't offer imagery.
    var OPEN_FREE_MAP_STREETS_STYLE = 'https://tiles.openfreemap.org/styles/liberty';
    var ESRI_SATELLITE_STYLE = {
      version: 8,
      sources: {
        'esri-satellite': {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          attribution: 'Esri, Maxar, Earthstar Geographics'
        }
      },
      layers: [
        { id: 'esri-satellite-layer', type: 'raster', source: 'esri-satellite' }
      ]
    };

    function styleFor(variant) {
      return variant === 'satellite' ? ESRI_SATELLITE_STYLE : OPEN_FREE_MAP_STREETS_STYLE;
    }

    // Without this, MapLibre GL JS renders Hebrew/Arabic map labels with
    // their characters in reversed visual order (it doesn't do complex-script
    // text shaping itself) — this plugin does the shaping. Lazy: only
    // downloaded the first time a tile actually needs RTL text.
    maplibregl.setRTLTextPlugin(
      'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.js',
      null,
      true
    );

    var currentStyleVariant = 'streets';
    var map = new maplibregl.Map({
      container: 'map',
      style: styleFor(currentStyleVariant),
      center: [initialLon, initialLat],
      zoom: initialZoom
    });
    // top-right, not top-left: MainActivity's native Settings/Alert-zones FABs
    // sit at layout_constraintEnd_toEndOf, which resolves to the physical left
    // edge in this RTL (Hebrew) app — top-left would collide with them.
    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    function StyleSwitcherControl() {}
    StyleSwitcherControl.prototype.onAdd = function (mapInstance) {
      this._map = mapInstance;
      var container = document.createElement('div');
      container.className = 'maplibregl-ctrl maplibregl-ctrl-group';

      var streetsBtn = document.createElement('button');
      streetsBtn.type = 'button';
      streetsBtn.title = 'מפת רחובות';
      streetsBtn.textContent = '🗺️';
      streetsBtn.onclick = function () { setMapStyleVariant('streets'); };

      var satelliteBtn = document.createElement('button');
      satelliteBtn.type = 'button';
      satelliteBtn.title = 'מפת לוויין';
      satelliteBtn.textContent = '🛰️';
      satelliteBtn.onclick = function () { setMapStyleVariant('satellite'); };

      container.appendChild(streetsBtn);
      container.appendChild(satelliteBtn);
      this._container = container;
      return container;
    };
    StyleSwitcherControl.prototype.onRemove = function () {
      this._container.parentNode.removeChild(this._container);
      this._map = undefined;
    };
    map.addControl(new StyleSwitcherControl(), 'top-right');

    // On by default at every fresh launch (no persistence across sessions —
    // just a per-viewing preference the user can toggle off if they want to
    // freely pan/zoom without being pulled back on every update).
    var autoCenterEnabled = true;

    function AutoCenterControl() {}
    AutoCenterControl.prototype.onAdd = function (mapInstance) {
      this._map = mapInstance;
      var container = document.createElement('div');
      container.className = 'maplibregl-ctrl maplibregl-ctrl-group';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.title = 'מרכוז אוטומטי על מיקום ההסעה';
      btn.textContent = '🎯';
      btn.style.opacity = autoCenterEnabled ? '1' : '0.4';
      btn.onclick = function () {
        autoCenterEnabled = !autoCenterEnabled;
        btn.style.opacity = autoCenterEnabled ? '1' : '0.4';
        if (autoCenterEnabled && rideMarker) {
          map.easeTo({ center: rideMarker.getLngLat(), zoom: map.getZoom() });
        }
      };
      container.appendChild(btn);
      this._container = container;
      return container;
    };
    AutoCenterControl.prototype.onRemove = function () {
      this._container.parentNode.removeChild(this._container);
      this._map = undefined;
    };
    // Only meaningful in view mode (MainActivity) — the only screen that
    // ever calls updateRideLocation().
    if (mode === 'view') {
      map.addControl(new AutoCenterControl(), 'top-right');
    }

    function setMapStyleVariant(variant) {
      if (variant === currentStyleVariant) return;
      currentStyleVariant = variant;
      map.setStyle(styleFor(variant));
    }

    var rideMarker = null;
    var lastRideLatLon = null;
    var zoneSourceId = 'alert-zones';
    var lastZones = [];

    // Bearing in degrees (0 = north) from point 1 to point 2, used to point
    // the ride marker's arrow in the direction of travel (like Waze/Google
    // Maps), computed client-side since posted samples carry no heading.
    function bearingDegrees(lat1, lon1, lat2, lon2) {
      var toRad = Math.PI / 180;
      var y = Math.sin((lon2 - lon1) * toRad) * Math.cos(lat2 * toRad);
      var x = Math.cos(lat1 * toRad) * Math.sin(lat2 * toRad) -
        Math.sin(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.cos((lon2 - lon1) * toRad);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    // A triangular direction arrow (Waze/Google Maps style) instead of a
    // plain dot, so the marker itself hints at which way the ride is
    // heading once bearingDegrees() has two fixes to compare.
    function createRideMarkerElement() {
      var el = document.createElement('div');
      el.innerHTML =
        '<svg width="30" height="30" viewBox="0 0 30 30">' +
        '<g class="ride-marker-arrow" style="transform-origin:15px 15px;">' +
        '<path d="M15 2 L26 26 L15 20 L4 26 Z" fill="#2E7D6B" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>' +
        '</g>' +
        '</svg>';
      return el;
    }

    // 'load' fires once for the map's whole lifetime; 'style.load' fires
    // on the initial load AND every subsequent setStyle() call, since
    // setStyle() wipes any custom sources/layers (but not DOM-based
    // markers, which survive style switches on their own).
    map.on('load', function () {
      if (window.Android && Android.onMapReady) {
        Android.onMapReady();
      }
    });
    map.on('style.load', function () {
      if (!map.getSource(zoneSourceId)) {
        map.addSource(zoneSourceId, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({
          id: zoneSourceId + '-fill',
          type: 'fill',
          source: zoneSourceId,
          paint: { 'fill-color': '#C0392B', 'fill-opacity': 0.2 }
        });
        map.addLayer({
          id: zoneSourceId + '-outline',
          type: 'line',
          source: zoneSourceId,
          paint: { 'line-color': '#C0392B', 'line-width': 2 }
        });
      }
      applyStoredZones();
    });

    if (mode === 'zones') {
      map.on('click', function (e) {
        if (window.Android && Android.onMapTap) {
          Android.onMapTap(e.lngLat.lat, e.lngLat.lng);
        }
      });
    }

    // --- Functions called from Kotlin via evaluateJavascript ---

    function updateRideLocation(lat, lon) {
      if (!rideMarker) {
        rideMarker = new maplibregl.Marker({ element: createRideMarkerElement() }).setLngLat([lon, lat]).addTo(map);
      } else {
        rideMarker.setLngLat([lon, lat]);
      }
      if (lastRideLatLon) {
        var heading = bearingDegrees(lastRideLatLon[0], lastRideLatLon[1], lat, lon);
        var arrow = rideMarker.getElement().querySelector('.ride-marker-arrow');
        if (arrow) arrow.style.transform = 'rotate(' + heading + 'deg)';
      }
      lastRideLatLon = [lat, lon];

      // Explicit zoom keeps whatever level the user is currently at — never
      // pulled back to some default just because auto-center re-centers.
      if (autoCenterEnabled) {
        map.easeTo({ center: [lon, lat], zoom: map.getZoom(), duration: 500 });
      }
    }

    function clearRideLocation() {
      if (rideMarker) {
        rideMarker.remove();
        rideMarker = null;
      }
      lastRideLatLon = null;
    }

    function centerMap(lat, lon, zoom) {
      map.jumpTo({ center: [lon, lat], zoom: zoom || map.getZoom() });
    }

    // zonesJson: JSON string of [{id, lat, lon, radiusMeters, name}]
    function setAlertZones(zonesJson) {
      lastZones = JSON.parse(zonesJson);
      applyStoredZones();
    }

    function applyStoredZones() {
      var source = map.getSource(zoneSourceId);
      if (!source) return;
      var features = lastZones.map(function (zone) {
        return { type: 'Feature', properties: { id: zone.id, name: zone.name }, geometry: circlePolygon(zone.lat, zone.lon, zone.radiusMeters) };
      });
      source.setData({ type: 'FeatureCollection', features: features });
    }

    function circlePolygon(lat, lon, radiusMeters, points) {
      points = points || 48;
      var coords = [];
      var earthRadius = 6371000;
      var latRad = lat * Math.PI / 180;
      for (var i = 0; i <= points; i++) {
        var angle = (i / points) * 2 * Math.PI;
        var dx = radiusMeters * Math.cos(angle);
        var dy = radiusMeters * Math.sin(angle);
        var dLat = dy / earthRadius;
        var dLon = dx / (earthRadius * Math.cos(latRad));
        coords.push([lon + (dLon * 180 / Math.PI), lat + (dLat * 180 / Math.PI)]);
      }
      return { type: 'Polygon', coordinates: [coords] };
    }

    function getCenter() {
      var c = map.getCenter();
      return c.lat + ',' + c.lng;
    }
  </script>
</body>
</html>
